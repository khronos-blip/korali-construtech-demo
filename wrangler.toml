name = "korali-construtech-demo"
main = "worker.js"
compatibility_date = "2026-09-23"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "404-page"

[[routes]]
pattern = "koralidigital.com/demos/construtech/*"
zone_name = "koralidigital.com"

[[routes]]
pattern = "www.koralidigital.com/demos/construtech/*"
zone_name = "koralidigital.com"
